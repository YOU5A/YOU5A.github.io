<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0c">
  <meta name="color-scheme" content="dark">
  <title>Astra | LUMA PIXEL Architecture Observatory</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#edf0f1;background:#080a0c;font-synthesis:none;--muted:#8e969b;--line:#ffffff12;--mint:#b4ebd4;--panel:284px}
    *{box-sizing:border-box;letter-spacing:0}
    body{margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button,select{cursor:pointer}
    button{color:inherit}
    button:disabled{cursor:not-allowed;opacity:.4}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:4px}
    button{border:0;background:none}
    svg{width:18px;height:18px;stroke-width:1.6;flex-shrink:0}
    [hidden]{display:none!important}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .glass{background:linear-gradient(125deg,#ffffff09,#ffffff02 48%,#ffffff05),#16191bcc;border:1px solid #ffffff19;box-shadow:inset 0 1px 0 #ffffff0b,0 18px 60px #0005;backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%)}
    .glass-track{position:relative;isolation:isolate}
    .glass-track:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,-500px) var(--my,-500px),#e6fff511,transparent 75%);z-index:-1;pointer-events:none}
    #stage,#labels{position:fixed;inset:0}
    #stage{display:block;touch-action:none;outline:none}
    #labels{pointer-events:none;overflow:hidden}
    .app-chrome{position:fixed;inset:0;pointer-events:none}
    .app-chrome>*{pointer-events:auto}
    .topbar{position:absolute;top:18px;left:22px;right:22px;min-height:64px;border-radius:16px;display:flex;align-items:center;gap:22px;padding:10px 16px;z-index:20}
    .brand{display:flex;align-items:center;gap:11px;min-width:218px}
    .brand-icon{width:34px;height:34px;display:grid;place-items:center;color:var(--mint)}
    .brand-icon svg{width:32px;height:32px;stroke-width:1.15}
    .brand-name{font-size:24px;font-weight:550;line-height:1}
    .brand-sub{font-size:9px;color:#a3aaae;margin-top:6px}
    .divider{height:25px;width:1px;background:var(--line);flex-shrink:0}
    .segments{display:flex;align-items:center;gap:3px;background:#0003;border:1px solid #ffffff08;padding:4px;border-radius:9px}
    .segments button{height:33px;padding:0 12px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;white-space:nowrap;color:#90999e;transition:background .2s,color .2s}
    .segments button[aria-pressed=true]{background:#ffffff13;color:#fff;box-shadow:inset 0 1px #ffffff10,0 2px 8px #0003}
    .segments button:hover{color:#fff}
    .camera-select{display:flex;align-items:center;gap:8px;position:relative;color:#bbc3c5}
    .camera-select select{appearance:none;border:0;background:none;color:inherit;padding:9px 22px 9px 0;font-size:11px;max-width:136px;outline-offset:2px}
    select option{background:#202426;color:#eee}
    .camera-select .chevron{position:absolute;right:0;width:12px;pointer-events:none}
    .toolbar-end{margin-left:auto;display:flex;align-items:center;gap:13px}
    .speed{display:flex;align-items:center;gap:8px}
    .icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:#a7b1b6;flex-shrink:0;transition:background .2s,color .2s}
    .icon-btn:hover{background:#ffffff10;color:white}
    .icon-btn[aria-pressed=true]{color:var(--mint);background:#b4ebd411}
    input[type=range]{accent-color:var(--mint);height:3px;width:58px;cursor:pointer}
    #speed-value{font-size:10px;color:#c2cacc;min-width:28px}
    .search-open{height:33px;display:flex;gap:9px;align-items:center;font-size:11px;color:#abb4b9;padding:0 10px;border:1px solid #ffffff14;border-radius:7px}
    kbd{font:10px -apple-system,BlinkMacSystemFont,sans-serif;color:#778288;background:#ffffff06;border:1px solid #ffffff0d;border-radius:4px;padding:2px 4px}
    .inspector{position:absolute;top:105px;left:22px;width:var(--panel);max-height:calc(100dvh - 166px);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;z-index:12}
    .panel-top{display:flex;justify-content:space-between;align-items:center;padding:17px 18px 13px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:9px;font-weight:500;color:#8f9a9f;text-transform:uppercase}
    .panel-top .icon-btn{width:24px;height:24px}
    .panel-body{overflow:auto;overscroll-behavior:contain;padding:21px 20px;scrollbar-width:thin;scrollbar-color:#ffffff20 transparent}
    .system-title{display:flex;align-items:center;gap:9px}
    .system-title h1{font-size:22px;font-weight:530;margin:0}
    .status-dot{width:6px;height:6px;flex-shrink:0;border-radius:50%;background:#a5e7c8;box-shadow:0 0 9px #a5e7c833}
    .system-subtitle{font-size:10px;color:#8c999f;margin:9px 0 0}
    .snapshot{display:flex;align-items:center;gap:6px;color:#b9c2c5;font-size:9px;margin-top:17px}
    .snapshot svg{width:12px;height:12px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
    .stat-number{font-size:31px;font-weight:350;line-height:1.2}
    .stat-label{font-size:10px;color:#929b9f;margin-top:7px}
    .section-title{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#a4afb3;margin:0 0 12px}
    .section-title .mono{font-size:9px;color:#67767f}
    .layer-list{display:grid;gap:2px}
    .layer-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;text-align:left;font-size:11px;color:#bec7cc}
    .layer-row:hover{color:#fff}
    .swatch{width:6px;height:6px;border-radius:2px;background:var(--color);flex-shrink:0}
    .layer-bar{height:2px;width:32px;background:#ffffff09;margin-left:auto;overflow:hidden}
    .layer-bar span{display:block;height:100%;width:var(--fill);background:var(--color);opacity:.7}
    .layer-count{font-size:10px;color:#828f97;width:20px;text-align:right}
    .contracts{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
    .contract{display:flex;gap:9px;align-items:flex-start;font-size:10px;line-height:1.8;color:#949fa5;margin-top:10px}
    .contract svg{width:13px;height:13px;color:#adcbbd;margin-top:3px}
    .panel-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:9px;color:#727f87}
    .panel-foot span:last-child{color:#a9b2b6}
    .scene-heading{position:absolute;left:calc(var(--panel) + 52px);top:113px;pointer-events:none}
    .scene-heading .eyebrow{font-size:9px;color:#829298}
    .scene-heading h2{font-size:26px;font-weight:400;margin:8px 0 7px}
    .scene-heading p{margin:0;font-size:10px;color:#7e8d95}
    .scene-heading .index{color:#b4ebd4;margin-right:9px}
    .session{position:absolute;right:29px;top:113px;text-align:right;font-size:9px;line-height:1.8;color:#809087;pointer-events:none}
    .session strong{display:block;color:#c2ccc8;font-weight:400;font-size:10px}
    .scene-legend{position:absolute;right:28px;bottom:89px;display:grid;gap:10px;pointer-events:none}
    .legend-line{display:flex;align-items:center;gap:9px;font-size:9px;color:#8e999e}
    .line-sample{width:20px;height:1px;background:var(--color);box-shadow:0 0 5px color-mix(in srgb,var(--color),transparent 65%)}
    .line-sample.dashed{height:0;background:none;border-top:1px dashed var(--color)}
    .dock-wrap{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);z-index:15}
    .dock{display:flex;gap:7px;align-items:center;padding:9px 12px;border-radius:15px}
    .dock button{position:relative;width:39px;height:39px;display:grid;place-items:center;border-radius:9px;background:#ffffff05;border:1px solid #ffffff05;color:#95a2a7;transform-origin:center bottom;will-change:transform;transition:color .2s,background .2s}
    .dock button svg{width:19px;height:19px}
    .dock button[aria-pressed=true]{color:#c7eddf;background:#b5e8d310;border-color:#b5e8d314}
    .dock button[aria-pressed=true]:after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--mint)}
    .dock .separator{height:23px;width:1px;background:#ffffff13;margin:0 3px}
    [data-tip]:before{content:attr(data-tip);position:absolute;bottom:calc(100% + 13px);left:50%;transform:translateX(-50%);background:#252a2eee;border:1px solid #ffffff1c;color:#e3eae6;white-space:nowrap;font-size:10px;padding:7px 9px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s}
    [data-tip]:focus-visible:before{opacity:1}
    @media(hover:hover) and (pointer:fine){[data-tip]:hover:before{opacity:1}}
    .statusbar{position:absolute;left:25px;right:25px;bottom:15px;display:flex;align-items:center;gap:17px;font-size:9px;color:#6d7b82;pointer-events:none}
    .statusbar .live{display:flex;gap:6px;align-items:center}
    .statusbar .live .status-dot{width:4px;height:4px}
    .statusbar .right{margin-left:auto;display:flex;gap:20px}
    #fps{color:#bcc7c7}
    .node-label{font-size:10px;color:#c4d2d4;white-space:nowrap;text-shadow:0 2px 7px #000,0 0 4px #000;display:flex;align-items:center;gap:6px;padding:4px 7px;background:#080b0e80;border:1px solid #ffffff08;border-radius:4px;transition:opacity .18s;pointer-events:none}
    .node-label .node-dot{width:4px;height:4px;background:var(--color);border-radius:50%}
    .node-label small{font-size:8px;color:#7c8d95}
    .node-label.major{font-size:11px;color:#edf2f1}
    .node-label.selected{border-color:#b4ebd455;color:#fff;background:#142b25d9}
    .group-label{font-size:10px;font-weight:500;color:var(--color);text-shadow:0 2px 10px #000;opacity:.65}
    #hover-tip{position:fixed;z-index:30;padding:12px 15px;border-radius:8px;pointer-events:none;max-width:240px}
    #hover-tip strong{font-size:11px;font-weight:500}
    #hover-tip p{margin:6px 0 0;font-size:10px;color:#a2b2b9;line-height:1.5}
    .node-heading{display:flex;align-items:center;gap:10px;margin:0 0 16px}
    .node-symbol{width:34px;height:34px;border:1px solid color-mix(in srgb,var(--color),transparent 70%);background:color-mix(in srgb,var(--color),transparent 94%);border-radius:8px;display:grid;place-items:center;color:var(--color);flex-shrink:0}
    .node-title{font-size:18px;line-height:1.3;margin:0;font-weight:500;overflow-wrap:anywhere}
    .node-category{font-size:9px;color:#8a989e;margin:6px 0 0}
    .node-desc{font-size:11px;line-height:1.9;color:#afbac0;margin-bottom:18px}
    .node-meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 23px}
    .badge{font-size:9px;color:#9bc9b4;border:1px solid #b4ebd422;background:#b4ebd409;padding:5px 7px;border-radius:4px}
    .badge.dormant{color:#d1b18c;border-color:#d1b18c33;background:#d1b18c09}
    .invariant{border-left:2px solid #c6b987;padding:2px 0 2px 11px;margin:0 0 22px}
    .invariant h3{font-size:9px;font-weight:500;color:#d5c69b;margin:0 0 8px;display:flex;gap:7px;align-items:center}
    .invariant h3 svg{width:12px;height:12px}
    .invariant p{font-size:10px;line-height:1.8;color:#a4acb0;margin:6px 0}
    .file-row{display:flex;align-items:flex-start;gap:4px;padding:9px 0;border-bottom:1px solid #ffffff08}
    .file-row code{font-size:9px;line-height:1.8;color:#abbec2;overflow-wrap:anywhere;user-select:text;flex:1}
    .file-row button{width:24px;height:24px}
    .file-row button svg{width:12px;height:12px}
    .flows-title{margin-top:22px}
    .flow-button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid #ffffff08}
    .flow-button:hover{color:var(--mint)}
    .flow-button svg{width:13px;height:13px;color:var(--color);flex-shrink:0}
    .flow-button span{min-width:0;flex:1}
    .flow-button b{display:block;font-size:10px;font-weight:400;overflow-wrap:anywhere}
    .flow-button small{display:block;font-size:9px;color:#798b95;margin-top:5px}
    #inspector-toggle{display:none;position:absolute;left:16px;top:144px;z-index:14;border-radius:8px;width:37px;height:37px}
    dialog{color:#edf0f1;border:1px solid #ffffff25;border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));max-height:70dvh;overflow:hidden}
    dialog::backdrop{background:#02060888;backdrop-filter:blur(9px)}
    .spotlight-input{display:flex;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}
    .spotlight-input svg{color:#a9c9bc}
    .spotlight-input input{width:100%;background:none;border:0;outline:none;color:#edf0f1;font-size:14px;min-width:0}
    .spotlight-input button{height:27px;width:27px}
    #search-summary{padding:13px 20px 5px;font-size:10px;color:#8b9b9f}
    #search-results{padding:7px 9px 13px;max-height:48dvh;overflow:auto}
    .search-result{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:12px 11px;border-radius:7px}
    .search-result:hover,.search-result:focus{background:#ffffff0a;outline:none}
    .search-result span:nth-child(2){flex:1;min-width:0}
    .search-result b{display:block;font-size:12px;font-weight:450;overflow-wrap:anywhere}
    .search-result small{font-size:10px;color:#81949b;display:block;margin-top:4px}
    .search-result svg{width:14px;color:#82958f}
    #filter-badge{position:absolute;left:calc(var(--panel) + 52px);top:202px;display:flex;align-items:center;gap:9px;border-radius:7px;padding:6px 10px;font-size:10px;z-index:10;max-width:calc(100vw - 370px)}
    #filter-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #filter-badge .icon-btn{width:20px;height:20px}
    #toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);z-index:40;padding:11px 17px;font-size:11px;border-radius:8px;pointer-events:none;max-width:calc(100vw - 30px);text-align:center}
    #loading{position:fixed;inset:0;background:#080a0c;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .65s}
    #loading.out{opacity:0;pointer-events:none}
    .loading-mark{font-size:39px;font-weight:300;color:#deeee7}
    .loading-sub{font-size:10px;color:#71817f;margin-top:10px}
    .loading-track{width:150px;height:1px;background:#ffffff10;margin:29px 0 18px;overflow:hidden}
    .loading-track span{display:block;height:100%;background:#b4ebd4;transform-origin:left;animation:load 1.7s ease-in-out infinite}
    #loading-status{font-size:11px;color:#a4afae;max-width:360px;line-height:1.9;text-align:center;padding:0 20px}
    #retry{margin-top:18px;padding:9px 20px;border:1px solid #ffffff30;border-radius:7px}
    @keyframes load{0%{transform:translateX(-100%) scaleX(.4)}100%{transform:translateX(100%) scaleX(.8)}}
    @media(min-width:1600px){:root{--panel:305px}.panel-body{padding:25px}.topbar{gap:28px}.brand{min-width:239px}.inspector{top:112px}.scene-heading{top:123px}}
    @media(max-width:1180px){.topbar{gap:13px}.brand{min-width:163px}.brand-sub{font-size:8px}.segments button{padding:0 9px}.toolbar-end{gap:5px}.speed input{width:40px}.search-open span,.search-open kbd{display:none}.search-open{padding:0 8px}.camera-select{gap:5px}.camera-select select{max-width:110px}.topbar>.divider{display:none}}
    @media(max-width:960px){:root{--panel:248px}.topbar{left:15px;right:15px}.brand{min-width:120px}.brand-sub{display:none}.brand-name{font-size:23px}.brand-icon{width:26px}.brand-icon svg{width:26px}.topbar{gap:10px}.segments button{padding:0 9px}.segments button span{display:none}.camera-select select{max-width:120px}.inspector{left:15px}.panel-body{padding:18px}.scene-heading{left:calc(var(--panel) + 36px)}.session{display:none}.scene-legend{right:18px}.dock-wrap{left:calc(50% + 70px)}}
    @media(max-width:700px){:root{--panel:270px}.topbar{left:12px;right:12px;top:12px;padding:10px 11px;gap:10px;flex-wrap:wrap;min-height:99px;border-radius:12px}.brand{min-width:0;flex:1}.brand-icon{width:27px}.brand-name{font-size:23px}.toolbar-end{order:2;gap:8px}.segments{order:3;flex:1;justify-content:stretch}.segments button{flex:1;padding:0 9px;height:27px}.segments button span{display:inline;font-size:10px}.segments svg{width:13px;height:13px}.camera-select{order:4;margin-left:auto}.camera-select>svg{width:14px}.camera-select select{font-size:10px;max-width:107px}.speed{gap:3px}.speed .icon-btn{width:24px}.speed input{width:40px}.speed output{font-size:9px!important}.search-open{height:29px;border:0}.scene-heading{top:137px;left:66px}.scene-heading h2{font-size:20px;margin:6px 0}.scene-heading p{font-size:9px}.scene-heading .eyebrow{font-size:8px}.inspector{top:190px;left:12px;width:min(284px,calc(100vw - 24px));max-height:calc(100dvh - 302px);display:none;background-color:#151b1eea}.inspector.mobile-open{display:flex}#inspector-toggle{display:grid}.scene-legend{bottom:118px;right:17px;gap:8px}.legend-line{font-size:8px}.line-sample{width:15px}.dock-wrap{left:50%;bottom:42px}.dock{gap:5px;padding:8px}.dock button{width:34px;height:36px;border-radius:7px}.dock button svg{width:17px}.dock .separator{margin:0 1px}.statusbar{left:14px;right:14px;bottom:15px;font-size:8px;gap:9px}.statusbar .right{gap:12px}.statusbar .hide-mobile{display:none}#filter-badge{left:16px;top:203px;max-width:calc(100vw - 32px)}.node-label{font-size:9px}.node-label.major{font-size:10px}.group-label{font-size:9px}}
    @media(max-width:700px){.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px}.brand{grid-column:1;grid-row:1}.toolbar-end{grid-column:2;grid-row:1}.segments{grid-column:1;grid-row:2;min-width:0}.camera-select{grid-column:2;grid-row:2}.segments button{min-width:0}}
    @media(max-width:370px){.topbar{gap:7px}.segments button{padding:0 6px}.segments button span{display:none}.camera-select select{max-width:97px}.dock{gap:4px}.dock button{width:31px}.speed input{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

<body>
  <canvas id="stage" aria-label="LUMA PIXEL 三维架构星图" tabindex="0"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div class="app-chrome">
    <header class="topbar glass glass-track">
      <div class="brand"><div class="brand-icon"><i data-lucide="orbit"></i></div><div><div class="brand-name">Astra<span style="color:#b4ebd4">.</span></div><div class="brand-sub">ARCHITECTURE OBSERVATORY</div></div></div>
      <div class="divider"></div>
      <nav class="segments" aria-label="拓扑布局">
        <button data-layout="galaxy" aria-pressed="true" title="星系布局"><i data-lucide="orbit"></i><span>星系</span></button>
        <button data-layout="layers" aria-pressed="false" title="分层布局"><i data-lucide="layers-3"></i><span>分层</span></button>
        <button data-layout="pipeline" aria-pressed="false" title="时序布局"><i data-lucide="workflow"></i><span>时序</span></button>
      </nav>
      <label class="camera-select"><i data-lucide="scan-eye"></i><select id="camera-view" aria-label="运镜视角"><option value="overview">全景概览</option><option value="render">核心引擎</option><option value="ipc">共享总线</option><option value="overlay">界面交互</option><option value="host">注入与宿主</option><option value="luau">Luau 执行层</option><option value="docs">规范与契约</option></select><i class="chevron" data-lucide="chevron-down"></i></label>
      <div class="toolbar-end">
        <div class="speed"><button class="icon-btn" id="play" aria-label="暂停星流" aria-pressed="false" title="暂停或继续星流"><i data-lucide="pause"></i></button><input type="range" id="speed" aria-label="星流速度" min=".5" max="3" step=".1" value="1"><output id="speed-value" class="mono">1.0x</output></div>
        <button class="search-open" id="search-open" aria-label="搜索组件"><i data-lucide="search"></i><span>搜索组件</span><kbd>⌘ K</kbd></button>
      </div>

        const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;
        if(document.hidden)return;
        if(state.playing){sceneTime.value+=dt*state.speed;clockUniform.value=sceneTime.value;}
        const time=sceneTime.value;
        for(const [id,v] of visuals){
          const breath=1+Math.sin(time*1.5+v.index)*.04;v.core.scale.setScalar(v.n.size*.43*breath);
          v.ring.rotation.z=time*.10+v.index*.32;v.orbit.rotation.z=time*.3+v.index*.5;
          if(state.query&&state.matches.has(id))v.ring.material.opacity=.7+Math.sin(time*3+v.index)*.25;
        }
        if(state.selected){const v=visuals.get(state.selected);selectedRing.visible=true;selectedRing.position.copy(v.root.position);selectedRing.quaternion.copy(camera.quaternion);selectedRing.scale.setScalar(v.n.size*(2.05+.1*Math.sin(time*2)));}
        if(pathsDirty)updatePaths();
        if(!isFlying){updateWheelZoom(dt);controls.update(dt);}
        if(resized){resized=false;if(!state.selected)overview(true);}
        renderer.info.reset();composer.render();labelRenderer.render(scene,camera);
        if(frameIndex++%3===0){updateLabels();updateHover();}
        frameCount++;
        if(now-fpsStart>=1000){const fps=frameCount*1000/(now-fpsStart);$('#fps').textContent=String(Math.round(fps));qualityStep(fps,now);frameCount=0;fpsStart=now;}
      }
      showOverview();$('#footer-count').textContent=`${NODES.length} NODES / ${LINKS.length} CONNECTIONS`;
      overview(true);updatePaths();renderer.setAnimationLoop(frame);
      await renderer.compileAsync(scene,camera);
      window.astraReady=true;clearTimeout(window.astraBootTimer);
      $('#loading').classList.add('out');setTimeout(()=>$('#loading').style.display='none',700);
      // Read-only diagnostics support local visual QA without exposing execution hooks.
      window.astraDiagnostics=()=>({
        ready:true,nodes:NODES.length,links:LINKS.length,protocol:PROTOCOL_VERSION,layout:state.layout,selected:state.selected,
        matches:state.query?state.matches.size:null,playing:state.playing,particles:state.particles,labels:state.labels,frozen:state.frozen,
        drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,pixelRatio,canvas:[renderer.domElement.width,renderer.domElement.height],
        camera:camera.position.toArray(),distance:camera.position.distanceTo(controls.target),time:clockUniform.value,
        screenNodes:NODES.map(n=>{const p=visuals.get(n.id).root.position.clone().project(camera);return{id:n.id,x:(p.x*.5+.5)*width,y:(-p.y*.5+.5)*height,z:p.z};})
      });
    }
    boot().catch(error=>{
      console.error('[Astra]',error);clearTimeout(window.astraBootTimer);
      $('#loading-status').textContent='场景初始化失败。请确认浏览器已启用 WebGL，且可以访问 jsDelivr 与 esm.sh。';
      $('#retry').hidden=false;
    });
  </script>
</body>
</html>
